.hero{position:relative;padding:0}
.slider{height:420px;overflow:hidden;position:relative}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.box{background:#0f0f0f;border:1px solid #222;padding:20px}
.box img{width:100%;max-height:160px;object-fit:cover;border-radius:6px}

form input,form textarea,form select{
width:100%;padding:10px;margin-bottom:10px;
background:#0f0f0f;border:1px solid #222;color:#fff
}
form button{background:#c69c00;border:none;padding:10px;font-weight:700;width:100%}

footer{background:#000;padding:20px;text-align:center;color:#aaa;border-top:1px solid #222}
iframe{width:100%;height:300px;border:0}

@media(max-width:768px){
.slider{height:260px}

<script>

function showPositions(){

var rank = document.getElementById("rank").value;
var position = document.getElementById("position");

position.innerHTML = "";

var options = [];

if(rank=="A"){
options=[
"Managing Director",
"Executive Director",
"Senior Vice President (SVP)",
"Vice President (VP)",
"Associate Vice President (AVP)",
"Executive Vice President (EVP)"
];
}

if(rank=="B"){
options=[
"General Manager (GM)",
"Senior General Manager (SGM)",
"Deputy General Manager (DGM)",
"Assistant General Manager (AGM)",
"Regional Director",
"Business Unit Director"
];
}

if(rank=="C"){
options=[
"Senior Manager",
"Manager",
"Deputy Manager",
"Assistant Manager",
"Project Manager",
"Operations Manager"
];
}

if(rank=="D"){
options=[
"Team Leader",
"Senior Team Leader",
"Project Lead",
"Operations Lead",
"Technical Lead",
"Shift Leader",
"Senior Engineer",
"Senior Analyst",
"Senior Consultant",
"Senior Executive",
"Senior Specialist",
"Senior Officer"
];
}

if(rank=="E"){
options=[
"Engineer",
"Analyst",
"Consultant",
"Executive",
"Specialist",
"Officer",
"Associate Engineer",
"Associate Analyst",
"Associate Consultant",
"Associate Executive",
"Junior Officer",
"Junior Specialist",
"Trainee Engineer",
"Management Trainee",
"Graduate Trainee",
"Intern",
"Assistant",
"Junior Executive",
"House Keeping",
"Worker",
"Driver",
"Other"
];
}

for(var i=0;i<options.length;i++){

var opt=document.createElement("option");
opt.value=options[i];
opt.innerHTML=options[i];

position.appendChild(opt);

}

}

</script>
