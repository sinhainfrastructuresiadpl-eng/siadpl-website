services:
  - type: web
    name: siadpl-api
    # Render no longer provides a native Java runtime. Build this Spring Boot
    # service from the Dockerfile below instead.
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8080
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://siadpl-website.onrender.com,https://siadpl.com,https://www.siadpl.com
      - key: JPA_DDL_AUTO
        value: update
      # Set these in the Render dashboard instead of committing them:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: sinhainfrastructure.siadpl@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ENQUIRY_EXPORT_KEY
        sync: false
