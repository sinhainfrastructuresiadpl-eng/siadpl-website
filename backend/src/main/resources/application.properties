spring.application.name=siadpl-api
server.port=${PORT:8080}

# Comma-separated frontend origins allowed to call this API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/siadpl}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC



# Admin enquiries access
app.admin.email=${ADMIN_EMAIL:sinhainfrastructure.siadpl@gmail.com}
app.admin.password=${ADMIN_PASSWORD:}
