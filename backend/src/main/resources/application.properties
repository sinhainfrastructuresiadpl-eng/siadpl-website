spring.application.name=siadpl-api
server.port=${PORT:8080}

# Comma-separated frontend origins allowed to call this API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/siadpl}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Email delivery (optional but recommended for production)
app.enquiry.recipient=${ENQUIRY_RECIPIENT:sinhainfrastructure.siadpl@gmail.com}
app.enquiry.export-key=${ENQUIRY_EXPORT_KEY:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}

# Google Sheets sync (optional)
app.google.sheets.enabled=${GOOGLE_SHEETS_ENABLED:false}
app.google.sheets.spreadsheet-id=${GOOGLE_SHEETS_SPREADSHEET_ID:1mhlixOdfR-EQ6kiwDL1Jew59k3bAzUcnYr_Mp8rwUow}
app.google.sheets.sheet-name=${GOOGLE_SHEETS_SHEET_NAME:Enquiries}
app.google.sheets.credentials-path=${GOOGLE_SHEETS_CREDENTIALS_PATH:}

# Admin enquiries access
app.admin.email=${ADMIN_EMAIL:sinhainfrastructure.siadpl@gmail.com}
app.admin.password=${ADMIN_PASSWORD:}
